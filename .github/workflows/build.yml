name: build

# Every push builds and launch-tests both platforms. A v* tag also publishes a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DENO_VERSION: 2.9.8 # Keep in step with mise.toml.

jobs:
  mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      # No secrets on pull requests from forks, so fall back to Deno's ad-hoc signature.
      - name: Decide signing mode
        id: mode
        env:
          CERT: ${{ secrets.CERT_P12_BASE64 }}
          NOTARY_KEY: ${{ secrets.AC_API_KEY_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "signed=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$NOTARY_KEY" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"
          else echo "notarize=false" >> "$GITHUB_OUTPUT"; fi

      # A tag publishes a release, and Gatekeeper refuses an unnotarized download on every
      # machine, so fail here rather than ship something that won't open.
      - name: Releases must be notarizable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${{ steps.mode.outputs.signed }}" != "true" ]; then
            echo "::error::Refusing to publish a release: CERT_P12_BASE64 is empty or unset."
            exit 1
          fi
          if [ "${{ steps.mode.outputs.notarize }}" != "true" ]; then
            echo "::error::Refusing to publish a release: AC_API_KEY_BASE64 is empty or unset."
            exit 1
          fi

      - name: Import Developer ID certificate
        if: steps.mode.outputs.signed == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$CERT_PATH"

      - name: Build
        run: deno task build:mac

      - name: Sign
        if: steps.mode.outputs.signed == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
        run: macos/sign.sh "dist/mac/Election Watcher.app" "$SIGN_IDENTITY"

      # A bad signature or missing entitlement only shows up when the app starts.
      - name: Launch test
        run: |
          "dist/mac/Election Watcher.app/Contents/MacOS/laufey_webview" &
          pid=$!
          sleep 15
          kill -0 "$pid" || { echo "::error::The app exited during its launch test"; exit 1; }
          kill "$pid"

      - name: Notarize and staple
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="dist/mac/Election Watcher.app"
          KEY_PATH="$RUNNER_TEMP/ac_api_key.p8"
          printf '%s' "$AC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY_PATH" --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" \
            --wait

          rm -f "$KEY_PATH"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Package
        run: ditto -c -k --keepParent "dist/mac/Election Watcher.app" dist/Election-Watcher-mac-arm64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/Election-Watcher-mac-arm64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Build
        run: deno task build:win

      # The app links the Visual C++ runtime. This runner has it installed but clean Windows
      # machines may not, and the launch test can't tell the difference, so ship it alongside
      # the exe and check nothing it links is left out.
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          $app = 'dist/windows/Election Watcher'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) {
            Write-Output "::error::No Visual C++ runtime found under $vs"
            exit 1
          }
          Copy-Item "$($crt.FullName)\*.dll" $app

          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $linked = & $dumpbin.FullName /dependents "$app\Election Watcher.exe" "$app\Election Watcher.dll" |
            Select-String '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
          $linked
          $missing = $linked | Where-Object { $_ -match '^(vcruntime|msvcp|concrt|vccorlib)' -and -not (Test-Path "$app\$_") }
          if ($missing) {
            Write-Output "::error::Not bundled: $($missing -join ', ')"
            exit 1
          }

      - name: Launch test
        shell: pwsh
        run: |
          Get-ChildItem -Force 'dist/windows/Election Watcher'
          $exe = Get-ChildItem 'dist/windows/Election Watcher/*.exe' | Select-Object -First 1
          $app = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) {
            Write-Output "::error::The app exited during its launch test (code $($app.ExitCode))"
            exit 1
          }
          Stop-Process -Id $app.Id -Force

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path 'dist/windows/Election Watcher' -DestinationPath dist/Election-Watcher-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Election-Watcher-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
